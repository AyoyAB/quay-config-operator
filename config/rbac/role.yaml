---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quay.ayoy.se
  resources:
  - repositorymirrors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quay.ayoy.se
  resources:
  - repositorymirrors/finalizers
  verbs:
  - update
- apiGroups:
  - quay.ayoy.se
  resources:
  - repositorymirrors/status
  verbs:
  - get
  - patch
  - update
