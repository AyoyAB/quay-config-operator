apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: create-repositorymirror
spec:
  description: Verify creating a RepositoryMirror CR reconciles successfully
  steps:
    - name: create-secret
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: quay-credentials
              stringData:
                host: http://quay-mock:8080
                token: test-token
                validateCerts: "false"
    - name: create-repositorymirror
      try:
        - apply:
            resource:
              apiVersion: quay.ayoy.se/v1alpha1
              kind: RepositoryMirror
              metadata:
                name: test-create
              spec:
                connSecretRef:
                  name: quay-credentials
                name: testorg/testrepo
                externalReference: registry.example.com/testrepo
                robotUsername: testorg+robot
                isEnabled: true
                imageTags:
                  - "latest"
                  - "v1.0"
                syncInterval: "86400"
    - name: assert-status-updated
      try:
        - assert:
            resource:
              apiVersion: quay.ayoy.se/v1alpha1
              kind: RepositoryMirror
              metadata:
                name: test-create
              status:
                existInQuay: true
                conditions:
                  - type: Successful
                    status: "True"
