apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: create-repositorymirror
spec:
  description: Verify creating a RepositoryMirror CR reconciles successfully
  steps:
    - name: create-repositorymirror
      try:
        - apply:
            resource:
              apiVersion: quay.ayoy.se/v1alpha1
              kind: RepositoryMirror
              metadata:
                name: test-create
              spec:
                connSecretRef:
                  name: quay-credentials
                  namespace: quay-system
                name: testorg/testrepo
                externalReference: kind-registry:5000/ayoy/quay-config-operator
                robotUsername: testorg+robot
                isEnabled: true
                imageTags:
                  - "latest"
                syncInterval: "86400"
    - name: assert-status-updated
      try:
        - assert:
            resource:
              apiVersion: quay.ayoy.se/v1alpha1
              kind: RepositoryMirror
              metadata:
                name: test-create
              status:
                existInQuay: true
                conditions:
                  - type: Running
                    status: "False"
                  - type: Successful
                    status: "True"
